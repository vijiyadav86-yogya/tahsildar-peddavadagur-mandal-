<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahsildar Office - Peddavadugur Mandal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0f4c81;
      --secondary: #198754;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --accent: #ff9933;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #e1e8ed;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), #1a365d);
      color: #ffffff;
      padding: 22px 18px;
      text-align: center;
      position: relative;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--accent);
    }

    .header h2 {
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .content-box {
      padding: 24px 20px;
    }

    /* Login Screen */
    #loginScreen {
      text-align: center;
    }

    .pin-input-group {
      margin: 20px 0;
    }

    .pin-input {
      width: 180px;
      padding: 12px;
      font-size: 1.5rem;
      text-align: center;
      letter-spacing: 8px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border 0.3s;
    }

    .pin-input:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.3s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0a365c;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #ffffff;
      margin-top: 15px;
    }

    .btn-whatsapp:hover {
      background: #1eb954;
    }

    /* Main Form Screen */
    #mainPortal {
      display: none;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"], input[type="date"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .contact-btn {
      position: absolute;
      right: 6px;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      color: var(--primary);
      transition: 0.2s;
    }

    .contact-btn:hover {
      background: #cbd5e1;
    }

    .days-flex {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.88rem;
      margin-top: 10px;
      display: none;
      font-weight: 600;
    }

    .file-input {
      border: 1px dashed #94a3b8;
      padding: 8px;
      border-radius: 7px;
      background: #f8fafc;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h2>TAHSILDAR OFFICE</h2>
    <p>PEDDAVADUGUR MANDAL, ANANTHAPURAMU DIST</p>
  </div>

  <div class="content-box">
    <!-- Step 1: Secure PIN Screen -->
    <div id="loginScreen">
      <div style="font-size: 2.2rem; color: var(--primary); margin-bottom: 8px;">
        <i class="fa-solid fa-lock"></i>
      </div>
      <p style="font-size: 0.95rem; font-weight: 600;">పోర్టల్ యాక్సెస్ పిన్ (PIN) నమోదు చేయండి</p>
      
      <div class="pin-input-group">
        <input type="password" id="accessPin" class="pin-input" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off">
      </div>
      
      <button type="button" class="btn btn-primary" onclick="verifyPin()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
      </button>
      <div id="pinError" class="error-msg">తప్పుడు పిన్! దయచేసి సరైన పిన్ (1207) నమోదు చేయండి.</div>
    </div>

    <!-- Step 2: Main Revenue Service Portal -->
    <div id="mainPortal">
      <form id="revenueForm" onsubmit="sendToWhatsApp(event)">
        <!-- Service Type Dropdown -->
        <div class="form-group">
          <label><i class="fa-solid fa-list-check"></i> రెవెన్యూ ఐటెమ్ ఎంచుకోండి (Service Category):</label>
          <select id="serviceType" required>
            <option value="" disabled selected>-- సెలెక్ట్ చేయండి --</option>
            <option value="ROR (Record of Rights)">ROR (Record of Rights)</option>
            <option value="PGRS (Spandana / అర్జీలు)">PGRS (Spandana అర్జీలు)</option>
            <option value="మండల అప్లికేషన్ (Mandal Application)">మండల అప్లికేషన్ (Mandal Application)</option>
            <option value="ఇతరములు (Others)">ఇతరములు (Others)</option>
          </select>
        </div>

        <!-- Phone Number & Contact Picker -->
        <div class="form-group">
          <label><i class="fa-solid fa-phone"></i> ఫోన్ నంబర్:</label>
          <div class="input-wrapper">
            <input type="text" id="phone" placeholder="9876543210" required>
            <button type="button" class="contact-btn" title="కాంటాక్ట్ పికర్" onclick="pickContact()">
              <i class="fa-solid fa-address-book"></i> కాంటాక్ట్
            </button>
          </div>
        </div>

        <!-- Applicant Name -->
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> దరఖాస్తుదారుడి పేరు (Applicant Name):</label>
          <input type="text" id="applicantName" placeholder="దరఖాస్తుదారుడి పేరు నమోదు చేయండి" required>
        </div>

        <!-- Application Number -->
        <div class="form-group">
          <label><i class="fa-solid fa-hashtag"></i> అప్లికేషన్ నంబర్ (Application No.):</label>
          <input type="text" id="appNumber" placeholder="ఉదా: AP/2026/XXXXX" required>
        </div>

        <!-- File Upload -->
        <div class="form-group">
          <label><i class="fa-solid fa-file-arrow-up"></i> అప్లికేషన్ ఫైల్ అప్‌లోడ్ (PDF / JPG):</label>
          <input type="file" id="appFile" class="file-input" accept=".pdf, image/jpeg, image/png">
        </div>

        <!-- Days and Target Date -->
        <div class="form-group">
          <label><i class="fa-solid fa-hourglass-half"></i> గడువు రోజులు (Timeline Days):</label>
          <div class="days-flex">
            <select id="presetDays" onchange="applyPresetDays(this.value)">
              <option value="" disabled selected>సెలెక్ట్ (1 - 10)</option>
              <option value="1">1 రోజు</option>
              <option value="2">2 రోజులు</option>
              <option value="3">3 రోజులు</option>
              <option value="4">4 రోజులు</option>
              <option value="5">5 రోజులు</option>
              <option value="6">6 రోజులు</option>
              <option value="7">7 రోజులు</option>
              <option value="8">8 రోజులు</option>
              <option value="9">9 రోజులు</option>
              <option value="10">10 రోజులు</option>
            </select>
            <input type="number" id="manualDays" placeholder="లేదా మాన్యువల్ డేస్" min="1" max="90" oninput="calculateDueDate(this.value)">
          </div>
        </div>

        <!-- Calculated Target Date -->
        <div class="form-group">
          <label><i class="fa-regular fa-calendar-days"></i> నిర్ణీత గడువు తేదీ (Target Date):</label>
          <input type="date" id="targetCalendar" required>
        </div>

        <!-- WhatsApp Button -->
        <button type="submit" class="btn btn-whatsapp">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp లో మెసేజ్ పంపండి
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  // 1. PIN verification (Enter key + Trim + Error handling)
  function verifyPin() {
    const pinInput = document.getElementById("accessPin");
    const enteredPin = pinInput.value.trim();
    const errorEl = document.getElementById("pinError");
    
    if (enteredPin === "1207") {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("mainPortal").style.display = "block";
      errorEl.style.display = "none";
      setDefaultDate();
    } else {
      errorEl.style.display = "block";
      errorEl.innerText = "తప్పుడు పిన్! దయచేసి 1207 నమోదు చేయండి.";
      pinInput.value = "";
      pinInput.focus();
    }
  }

  // Keypress listener: Enter నొక్కినా లాగిన్ అవుతుంది
  document.addEventListener("DOMContentLoaded", function() {
    const pinBox = document.getElementById("accessPin");
    if (pinBox) {
      pinBox.focus();
      pinBox.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          verifyPin();
        }
      });
    }
  });

  // 2. Default date (ఈ రోజు తేదీ సెట్ చేయడం)
  function setDefaultDate() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("targetCalendar").value = today;
  }

  // 3. Web Contact Picker API (మొబైల్ ఫోన్ కాంటాక్ట్స్ ఎంచుకోవడం)
  async function pickContact() {
    if ('contacts' in navigator && 'ContactsManager' in window) {
      try {
        const props = ['name', 'tel'];
        const opts = { multiple: false };
        const contacts = await navigator.contacts.select(props, opts);
        
        if (contacts && contacts.length > 0) {
          const contact = contacts[0];
          if (contact.name && contact.name.length > 0) {
            document.getElementById("applicantName").value = contact.name[0];
          }
          if (contact.tel && contact.tel.length > 0) {
            let cleanPhone = contact.tel[0].replace(/[^0-9]/g, '');
            if (cleanPhone.length > 10) cleanPhone = cleanPhone.slice(-10);
            document.getElementById("phone").value = cleanPhone;
          }
        }
      } catch (ex) {
        console.log("కాంటాక్ట్ ఎంపిక రద్దు చేయబడింది:", ex);
      }
    } else {
      alert("మీ బ్రౌజర్‌లో Contact Picker సపోర్ట్ లేదు. నేరుగా వివరాలు ఎంటర్ చేయండి.");
    }
  }

  // 4. గడువు రోజుల ప్రకారం తేదీ ఆటోమేటిక్‌గా మారడం
  function applyPresetDays(val) {
    document.getElementById("manualDays").value = val;
    calculateDueDate(val);
  }

  function calculateDueDate(days) {
    const count = parseInt(days);
    if (!isNaN(count) && count >= 0) {
      const d = new Date();
      d.setDate(d.getDate() + count);
      const formatted = d.toISOString().split('T')[0];
      document.getElementById("targetCalendar").value = formatted;
    }
  }

  // 5. WhatsApp మెసేజ్ బిల్డ్ చేసి పంపడం
  function sendToWhatsApp(e) {
    e.preventDefault();

    const service = document.getElementById("serviceType").value;
    const phone = document.getElementById("phone").value.trim();
    const name = document.getElementById("applicantName").value.trim();
    const appNo = document.getElementById("appNumber").value.trim();
    const days = document.getElementById("manualDays").value || "N/A";
    const dueDate = document.getElementById("targetCalendar").value;

    const message = 
`🏛️ *TAHSILDAR OFFICE, PEDDAVADUGUR* 🏛️
-----------------------------------
📋 *సర్వీస్ రకం:* ${service}
👤 *దరఖాస్తుదారు:* ${name}
🔢 *అప్లికేషన్ నం:* ${appNo}
⏳ *గడువు రోజులు:* ${days} రోజులు
📅 *పరిష్కార గడువు తేదీ:* ${dueDate}
-----------------------------------
_గమనిక: మీ దరఖాస్తు పరిశీలనలో ఉంది._`;

    let formattedPhone = phone.replace(/[^0-9]/g, '');
    if (formattedPhone.length === 10) {
      formattedPhone = "91" + formattedPhone;
    }

    const whatsappUrl = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
  }
</script>
</body>
</html>
